# Render Blueprint: New > Blueprint > connect this repo.
# After deploy, URL is usually https://<name>.onrender.com — set the same value on Vercel as VITE_API_BASE_URL.
services:
  - type: web
    name: karthuizer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
